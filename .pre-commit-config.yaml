# crag:auto-start
# Generated from governance.md by crag
# Regenerate: crag compile --target pre-commit
repos:
  - repo: local
    hooks:
      - id: gate-1
        name: "lint: composer validate --strict"
        entry: bash -c 'composer validate --strict'
        language: system
        pass_filenames: false
        always_run: true
      - id: gate-2
        name: "test: composer test"
        entry: bash -c 'composer test'
        language: system
        pass_filenames: false
        always_run: true
      - id: gate-3
        name: "build: npm run build"
        entry: bash -c 'npm run build'
        language: system
        pass_filenames: false
        always_run: true

# crag:auto-end
