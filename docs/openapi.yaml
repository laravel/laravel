openapi: 3.1.0
info: {title: MealFlow API, version: 1.0.0, description: Flutter-ready multi-company meal delivery API}
servers: [{url: /api/v1}]
security: [{sanctum: []}]
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer}}
  schemas:
    Delivery: {type: object, required: [uuid, customer_id, delivery_date, meal_option, status, idempotency_key], properties: {uuid: {type: string, format: uuid}, customer_id: {type: string, format: uuid}, delivery_date: {type: string, format: date}, meal_option: {enum: [morning, evening]}, status: {enum: [delivered, not_delivered, customer_absent, paused, cancelled]}, quantity: {type: integer, minimum: 1}, idempotency_key: {type: string}, record_version: {type: integer}}}
    Payment: {type: object, required: [amount, mode, idempotency_key], properties: {invoice_id: {type: string, format: uuid}, customer_id: {type: string, format: uuid}, amount: {type: number, multipleOf: 0.01}, mode: {enum: [cash, card]}, paid_at: {type: string, format: date-time}, idempotency_key: {type: string}, record_version: {type: integer}}}
    Handover: {type: object, required: [uuid, amount_submitted, idempotency_key], properties: {uuid: {type: string, format: uuid}, amount_submitted: {type: number, multipleOf: 0.01}, idempotency_key: {type: string}}}
paths:
  /auth/login: {post: {security: [], description: 'device_key identifies the tablet; a disabled device is rejected on login and on every later request.', responses: {'200': {description: 'Bearer token, device and user'}, '422': {description: 'Invalid credentials or disabled device'}}}}
  /auth/logout: {post: {responses: {'204': {description: 'Current token revoked'}}}}
  /devices: {get: {responses: {'200': {description: 'Paginated tablet devices (company_admin, supervisor)'}}}, post: {description: 'Register/update the device tied to the current token, called after login.', responses: {'201': {description: 'Device registered'}}}}
  /devices/{device}: {patch: {parameters: [{name: device, in: path, required: true, schema: {type: string, format: uuid}}], description: 'action: approve or disable (company_admin only). A disabled device is rejected on every subsequent request.', responses: {'200': {description: 'Device updated'}}}}
  /me: {get: {responses: {'200': {description: 'Authenticated user and company'}}}}
  /buildings: {get: {responses: {'200': {description: 'Paginated tenant buildings'}}}}
  /buildings/{building}/summary: {get: {parameters: [{name: building, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Workers, meals today, billed/received/outstanding for one building'}}}}
  /rooms: {get: {responses: {'200': {description: 'Paginated tenant rooms'}}}}
  /customers: {get: {responses: {'200': {description: 'Paginated tenant customers, filterable by ?search='}}}}
  /customers/qr/{token}: {get: {parameters: [{name: token, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Customer profile resolved from a scanned QR code'}}}}
  /customers/{customer}: {get: {parameters: [{name: customer, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Customer profile with building, room, plans and invoices'}}}}
  /customers/{customer}/receipts: {get: {parameters: [{name: customer, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Paginated receipt history for a customer'}}}}
  /customers/{customer}/ledger: {get: {parameters: [{name: customer, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Immutable customer ledger'}}}}
  /customers/{customer}/pauses: {post: {parameters: [{name: customer, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'201': {description: 'Meal pause created'}}}}
  /customers/{customer}/skips: {post: {parameters: [{name: customer, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'201': {description: 'Date-specific meal skip created'}}}}
  /customers/bulk-pause: {post: {description: 'Apply a meal pause to a set of customer_ids (company_admin, supervisor).', responses: {'200': {description: '{processed: count}'}}}}
  /customers/bulk-plan: {post: {description: 'Reassign a meal plan/rate to a set of customer_ids (company_admin, supervisor).', responses: {'200': {description: '{processed: count}'}}}}
  /meal-plans: {get: {responses: {'200': {description: 'Paginated meal plans'}}}}
  /deliveries: {get: {responses: {'200': {description: 'Paginated deliveries, filterable by ?date='}}}, post: {requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Delivery'}}}}, responses: {'201': {description: 'Recorded'}}}}
  /deliveries/bulk: {post: {description: 'scope: room|building|customers. room/building need scope_id (uuid); customers needs customer_ids (uuid[]).', responses: {'200': {description: '{processed: count}'}}}}
  /deliveries/{delivery}/change-requests: {post: {parameters: [{name: delivery, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'201': {description: 'Supervisor approval requested'}}}}
  /delivery-change-requests: {get: {responses: {'200': {description: 'Pending and reviewed delivery changes (company_admin, supervisor)'}}}}
  /delivery-change-requests/{change}: {patch: {parameters: [{name: change, in: path, required: true, schema: {type: string, format: uuid}}], description: 'decision: approve or reject (company_admin, supervisor).', responses: {'200': {description: 'Reviewed'}}}}
  /invoices: {get: {responses: {'200': {description: 'Paginated invoices'}}}, post: {description: 'Generates/returns the invoice for customer_id + period_start/period_end via BillingService (platform_admin, company_admin, supervisor).', responses: {'201': {description: 'Invoice generated'}}}}
  /invoices/{invoice}/pdf: {get: {parameters: [{name: invoice, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Invoice PDF download'}}}}
  /invoices/{invoice}/share: {post: {parameters: [{name: invoice, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'wa.me link (translated per company locale) + 30-minute signed PDF url'}}}}
  /payments: {post: {requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}, responses: {'201': {description: 'Payment, ledger entry and receipt created'}, '422': {description: 'Conflict'}}}}
  /payments/{payment}/proof: {post: {parameters: [{name: payment, in: path, required: true, schema: {type: string, format: uuid}}], requestBody: {content: {multipart/form-data: {schema: {type: object, properties: {proof: {type: string, format: binary}}}}}}, responses: {'200': {description: 'Proof stored privately'}}}}
  /payments/{payment}/corrections: {post: {parameters: [{name: payment, in: path, required: true, schema: {type: string, format: uuid}}], description: 'Payments cannot be deleted; a correction reverses the original and creates a replacement once approved.', responses: {'201': {description: 'Correction requested'}}}}
  /payment-corrections: {get: {responses: {'200': {description: 'Payment correction approval queue (company_admin, supervisor)'}}}}
  /payment-corrections/{correction}: {patch: {parameters: [{name: correction, in: path, required: true, schema: {type: string, format: uuid}}], description: 'decision: approve or reject (company_admin, supervisor).', responses: {'200': {description: 'Reviewed'}}}}
  /receipts/{receipt}/pdf: {get: {parameters: [{name: receipt, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Receipt PDF download'}}}}
  /receipts/{receipt}/share: {post: {parameters: [{name: receipt, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'wa.me link (translated per company locale) + 30-minute signed PDF url'}}}}
  /proofs/{type}/{uuid}: {get: {parameters: [{name: type, in: path, required: true, schema: {enum: [payment, handover]}}, {name: uuid, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: 'Private proof image/file download'}}}}
  /collections: {get: {responses: {'200': {description: 'Employee collection totals grouped by date/employee/mode'}}}}
  /cash-handovers: {get: {responses: {'200': {description: 'Handover history'}}}, post: {requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Handover'}}}}, responses: {'201': {description: 'Submitted'}}}}
  /cash-handovers/{handover}/proof: {post: {parameters: [{name: handover, in: path, required: true, schema: {type: string, format: uuid}}], requestBody: {content: {multipart/form-data: {schema: {type: object, properties: {proof: {type: string, format: binary}}}}}}, responses: {'200': {description: 'Proof stored privately'}}}}
  /cash-handovers/{handover}/verify: {patch: {parameters: [{name: handover, in: path, required: true, schema: {type: string, format: uuid}}], description: 'status: verified or rejected (company_admin, supervisor).', responses: {'200': {description: 'Verified'}}}}
  /daily-closings: {post: {description: 'Employee daily closing totals calculated server-side from the days payments/handovers.', responses: {'201': {description: 'Closing recorded'}}}}
  /employees: {get: {responses: {'200': {description: 'Paginated company employees (company_admin, supervisor)'}}}, post: {description: 'Create an employee with an optional building_ids array assignment (company_admin only).', responses: {'201': {description: 'Employee created'}}}}
  /employees/{employee}: {patch: {parameters: [{name: employee, in: path, required: true, schema: {type: string, format: uuid}}], description: 'Update name/phone/role/is_active/building_ids (company_admin only).', responses: {'200': {description: 'Employee updated'}}}}
  /notifications: {get: {responses: {'200': {description: 'In-app notifications for the current user, plus company-wide broadcasts'}}}}
  /notifications/{notification}/read: {patch: {parameters: [{name: notification, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'204': {description: 'Marked read'}}}}
  /notifications/announce: {post: {description: 'Broadcast an announcement to every user in the company (platform_admin, company_admin, supervisor).', responses: {'201': {description: 'Announcement created'}}}}
  /imports: {get: {responses: {'200': {description: 'Import batch history (company_admin, supervisor)'}}}, post: {description: 'type: buildings|rooms|customers. CSV/XLSX upload against an approved column template (company_admin, supervisor).', requestBody: {content: {multipart/form-data: {schema: {type: object, properties: {type: {type: string}, file: {type: string, format: binary}}}}}}, responses: {'201': {description: 'Import batch processed, with per-row errors if any'}}}}
  /settings: {get: {responses: {'200': {description: 'Current company settings'}}}, put: {description: 'Update currency/timezone/delivery_cutoff_time/invoice_due_days/receipt_prefix/locale/low_balance_threshold (company_admin only).', responses: {'200': {description: 'Settings updated'}}}}
  /reports/{report}: {get: {parameters: [{name: report, in: path, required: true, schema: {enum: [deliveries, billing, collections, outstanding, cash-pending, building-meals, customer-statement, payment-status, building-outstanding, revenue-summary, audit-log]}}, {name: customer, in: query, required: false, description: 'Required uuid when report=customer-statement', schema: {type: string, format: uuid}}, {name: from, in: query, required: false, schema: {type: string, format: date}}, {name: to, in: query, required: false, schema: {type: string, format: date}}], responses: {'200': {description: 'Filtered report data as {head, rows} (company_admin, supervisor)'}}}}
  /reports/{report}/{format}: {get: {parameters: [{name: report, in: path, required: true, schema: {type: string}}, {name: format, in: path, required: true, schema: {enum: [csv, xlsx, pdf]}}], responses: {'200': {description: 'Report file download'}}}}
