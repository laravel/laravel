services:
  - type: web
    name: arcanepay-api
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan migrate --force
      php artisan db:seed --force
    startCommand: php artisan serve --host 0.0.0.0 --port 10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://api.arcanepay.biz.id
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: arcanepay-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: arcanepay-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: arcanepay-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: arcanepay-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: arcanepay-db
          property: password
      - key: FONNTE_TOKEN
        sync: false
      - key: TRIPAY_API_KEY
        sync: false
      - key: TRIPAY_PRIVATE_KEY
        sync: false
      - key: TRIPAY_MERCHANT_CODE
        sync: false
      - key: TRIPAY_ENV
        value: sandbox
      - key: SUPPLIER_API_KEY
        sync: false
      - key: SUPPLIER_API_URL
        sync: false
      - key: SUPPLIER_USERNAME
        sync: false

databases:
  - name: arcanepay-db
    databaseName: arcanepay
    user: arcanepay
    plan: free
